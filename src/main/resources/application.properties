# ==============================
# Basic Application Configuration
# ==============================
spring.application.name=paintworks

# ==============================
# Server Configuration
# ==============================
server.port=${PORT:8080}

# ==============================
# Database Configuration (PostgreSQL - Render)
# ==============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# ==============================
# Hibernate / JPA Configuration
# ==============================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# CORS Configuration
# ==============================
allowed.origins=https://pworkersbookinapp.netlify.app

# ==============================
# Path Matching Strategy
# ==============================
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# ==============================
# Logging Configuration
# ==============================
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.springframework.security=DEBUG

# ==============================
# Error Handling (Optional)
# ==============================
server.error.include-message=never
server.error.include-binding-errors=never

# ==============================
# File Upload Settings (Optional)
# ==============================
# spring.servlet.multipart.max-file-size=5MB
# spring.servlet.multipart.max-request-size=5MB

# ==============================
# Static Resources Configuration
# ==============================
spring.web.resources.static-locations=classpath:/static/

# ==============================
# HTTP Encoding Configuration
# ==============================
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# ==============================
# JWT Configuration
# ==============================
jwt.secret-key=ThisIsASecretKeyForJWTThatIs32Chars!!
jwt.expiration-time=3600000
